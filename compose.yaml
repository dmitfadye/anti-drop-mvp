services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: antidrop
      POSTGRES_USER: antidrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a local .env using scripts/init_sandbox.py}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:?Generate a runtime database password}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - antidrop-postgres:/var/lib/postgresql/data
      - ./infra/001_runtime_role.sql:/docker-entrypoint-initdb.d/001_runtime_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antidrop -d antidrop"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal, edge]
  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://antidrop:${POSTGRES_PASSWORD}@postgres:5432/antidrop
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://antidrop_app:${API_DATABASE_PASSWORD}@postgres:5432/antidrop
      SANDBOX_TOKENS: ${SANDBOX_TOKENS:?Generate local sandbox credentials first}
    ports: ["127.0.0.1:8010:8000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal, edge]
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      SANDBOX_WEB_TOKEN: ${SANDBOX_WEB_TOKEN:?Generate local web credentials first}
      SANDBOX_WEB_SUBJECT: ${SANDBOX_WEB_SUBJECT:?Generate local web profile first}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [edge]
networks:
  edge:
    driver: bridge
  internal:
    internal: true
volumes:
  antidrop-postgres:
