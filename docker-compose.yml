services:
  postgres:
    image: postgres:16-alpine
    container_name: anti-drop-pg
    environment:
      POSTGRES_DB: anti_drop
      POSTGRES_USER: anti_drop
      POSTGRES_PASSWORD: anti_drop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anti_drop -d anti_drop"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
