name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Не блокируем PR на необязательных проверках: обязателен только тестовый набор.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install from frozen lockfile
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then
            pip install -r requirements-lock.txt
          else
            pip install -r requirements.txt
          fi

      - name: Report environment
        run: |
          python -VV
          python -c "import fastapi, pydantic; print('fastapi', fastapi.__version__, 'pydantic', pydantic.VERSION)"

      - name: Lint / typecheck (only if configured)
        run: |
          set -e
          if command -v ruff >/dev/null 2>&1; then ruff check src anti_drop_ml scripts tests; fi
          if python -c "import mypy" >/dev/null 2>&1; then python -m mypy src anti_drop_ml; fi
          echo "lint step finished (project declares no mandatory linter)"

      - name: Unit, contract and negative tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate synthetic fixtures (deterministic)
        run: python -m scripts.generate_synthetic_fixtures --output-dir fixtures/episodes

      - name: Evaluation smoke on synthetic fixtures
        run: |
          python -m anti_drop_ml.evaluation.runner \
            --dataset fixtures/episodes/all_episodes_p1.jsonl \
            --output-dir reports/evaluation \
            --cost-false-alert 650 --cost-missed-risk 45000 --prevalence 0.002

      - name: Financial model smoke
        run: |
          python -m scripts.run_financial_model \
            --config configs/financial_assumptions.json --output-dir reports/finance

      - name: Blinded scoring template (empty by design)
        run: python -m scripts.export_blinded_scoring --experiment-id exp-warning-language-2026.10

      - name: Pilot stop criteria gate
        # A non-zero exit here is a truthful statement that the pilot is not ready.
        # The step is allowed to fail the job only on a malformed config, which
        # validate_stop_criteria distinguishes with exit code 2.
        run: |
          set +e
          python -m scripts.validate_stop_criteria --config configs/pilot_stop_criteria.json
          code=$?
          if [ "$code" -eq 2 ]; then exit 2; fi
          echo "stop criteria validated; ready_to_start is expected to be false"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/evaluation
          if-no-files-found: warn

      - name: Upload finance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-report
          path: reports/finance
          if-no-files-found: warn

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-artifacts
          path: reports/experiment
          if-no-files-found: warn